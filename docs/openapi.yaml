components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer pnl_...` — Hesabım → API Anahtarları'ndan
        üretilir. Panelin çerez oturumu da kabul edilir ama o yolda
        `x-csrf-token` başlığı zorunludur.

  headers:
    ApiVersion:
      description: Bilgi amaçlı sürüm; pazarlık için değil
      schema: { type: string, example: "1" }
    IdempotencyReplayed:
      description: |
        `true` ise bu yanıt kayıtlı bir yanıtın tekrarıdır ve komut
        yeniden ÇALIŞTIRILMAMIŞTIR.
      schema: { type: string, example: "true" }

  parameters:
    ContainerId:
      name: id
      in: path
      required: true
      description: Container adı, tam id veya id öneki — üçü de çalışır
      schema: { type: string }
    ResourceId:
      name: id
      in: path
      required: true
      description: |
        Kaynağın sayısal kimliği. Bozuk bir kimlik (`abc`) `400` döner,
        `404` değil — istemci kimliğinin bozuk olduğunu değil, kaydın
        silindiğini sanmasın diye.
      schema: { type: integer }
    CollectionLimit:
      name: limit
      in: query
      description: |
        Kaç kayıt. Tavanı aşan değer **sessizce kırpılır** (hata değil):
        fazla veri istemek bir hata değil, karşılanamayan bir istek.
      schema: { type: integer, default: 200, maximum: 500 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        En fazla 128 karakter, yalnızca `A-Z a-z 0-9 _ . : -`. Aynı anahtarla
        pencere içinde gelen ikinci istek komutu tekrar çalıştırmaz.
        Anahtarlar kullanıcıya göre ayrılmıştır.
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9_.:-]{1,128}$"

  responses:
    Unauthorized:
      description: |
        Geçerli anahtar yok. Sebep dışarı verilmez — "iptal edilmiş" ile
        "böyle bir anahtar yok" arasındaki fark, tarama yapan birine bilgi
        olurdu.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Kimlik doğru, izin yetersiz
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Kaynak yok — **ya da `api.enabled` kapalı**
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidRequest:
      description: Gövde, parametre veya başlık hatalı
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BodyTooLarge:
      description: Gövde `api.max_body_bytes` sınırını aşıyor (varsayılan 64 KB)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: "`Content-Type` `application/json` değil"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: |
        Aynı `Idempotency-Key` ile gönderilen komut host tarafında zaten
        görülmüş. Anlamı **belirsizlik değil, kesinlik**: ilk komut çalışmıştır.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: İstek sınırı aşıldı
      headers:
        Retry-After:
          description: Kaç saniye sonra tekrar denenebilir
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamError:
      description: Docker ya da host-helper hata döndürdü
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    HelperUnavailable:
      description: |
        host-helper kurulu değil ya da sokete ulaşılamıyor. Mesaj kurulum
        talimatını taşır.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Deleted:
      description: |
        Silindi. Silinen kaydın gövdesi dönmez, yalnızca kimliği —
        istemciye artık var olmayan bir şeyi işlemeye devam edebileceğini
        düşündürmemek için.
      content:
        application/json:
          schema:
            type: object
            properties:
              deleted: { type: boolean, example: true }
              id: { type: integer }

  schemas:
    Error:
      type: object
      description: |
        v1'in hata zarfı iç uçlardan bilerek farklı. Kod sabittir, mesaj insan
        içindir ve DEĞİŞEBİLİR — istemci `code`'a bakar, `message`'a değil.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - forbidden
                - not_found
                - invalid_request
                - conflict
                - rate_limited
                - upstream_error
                - internal_error
            message:
              type: string

    System:
      type: object
      properties:
        hostId:
          type: integer
          example: 1
          description: |
            Çok-host hazırlığı (T7). Bugün her zaman 1. Alanı sonradan
            eklemek kırıcı değil ama ANLAMINI sonradan değiştirmek — "bu
            liste artık tüm host'ları kapsıyor" — kırıcı olurdu.
        hostname: { type: string }
        platform: { type: string }
        kernel:
          type: string
          description: İç ad `release`; dışarıda `kernel` çünkü ne olduğunu söylüyor
        osName: { type: string, nullable: true }
        arch: { type: string }
        cpuModel: { type: string }
        cpuCount: { type: integer }
        totalMemoryBytes: { type: integer }
        uptimeSeconds: { type: integer }
        metrics:
          type: object
          properties:
            measuredAt: { type: integer, nullable: true }
            cpuPercent: { type: number, nullable: true }
            cpuIowaitPercent: { type: number, nullable: true }
            memoryUsedPercent: { type: number, nullable: true }
            memoryUsedBytes: { type: integer, nullable: true }
            memoryTotalBytes: { type: integer, nullable: true }
            swapUsedPercent: { type: number, nullable: true }
            load1: { type: number, nullable: true }
            load5: { type: number, nullable: true }
            load15: { type: number, nullable: true }
            disks:
              type: array
              items:
                type: object
                properties:
                  mount: { type: string }
                  usedPercent: { type: number }
                  usedBytes: { type: integer }
                  freeBytes: { type: integer }
                  totalBytes: { type: integer }
            interfaces:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  rxBytesPerSecond: { type: number }
                  txBytesPerSecond: { type: number }

    Hardware:
      type: object
      properties:
        hostId: { type: integer, example: 1 }
        reportedAt: { type: integer, nullable: true }
        virtualization: { type: string, nullable: true }
        notes:
          type: array
          description: Verinin neden eksik olduğu
          items: { type: string }
        temperatures:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              source: { type: string }
              label: { type: string }
              celsius: { type: number }
              highCelsius: { type: number, nullable: true }
              criticalCelsius: { type: number, nullable: true }
        disks:
          type: array
          items:
            type: object
            properties:
              device: { type: string }
              model: { type: string }
              serial: { type: string, nullable: true }
              sizeBytes: { type: integer, nullable: true }
              health: { type: string }
              temperatureCelsius: { type: number, nullable: true }
              powerOnHours: { type: integer, nullable: true }
              reallocatedSectors: { type: integer, nullable: true }
              pendingSectors: { type: integer, nullable: true }
              uncorrectableErrors: { type: integer, nullable: true }
              percentageUsed: { type: number, nullable: true }
        pools:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              kind: { type: string }
              state: { type: string }
              healthy: { type: boolean }
              detail: { type: string }
              lastScrubAt: { type: integer, nullable: true }
              scrubResult: { type: string, nullable: true }

    MetricSeries:
      type: object
      properties:
        hostId: { type: integer, example: 1 }
        range: { type: string }
        tier:
          type: string
          description: Hangi katmandan okundu (ham / 1dk / 1sa / 1gün)
        resolutionSeconds: { type: integer }
        from: { type: integer }
        to: { type: integer }
        series:
          type: array
          items:
            type: object
            properties:
              metric: { type: string }
              label: { type: string }
              points:
                type: array
                items:
                  type: object
                  properties:
                    ts: { type: integer }
                    avg: { type: number, nullable: true }
                    min: { type: number, nullable: true }
                    max: { type: number, nullable: true }

    Container:
      type: object
      description: |
        `labels` ve `networks` bilerek dışarı verilmiyor: etiketler üçüncü
        taraf imajların koyduğu her şeyi içeriyor (bazen ortam bilgisi, bazen
        yol) ve sözleşmeye girmeleri ileride daraltılamayacak bir yüzey
        açardı. Gerçekten gerekirse eklemek serbest; çıkarmak değil.
      properties:
        hostId: { type: integer, example: 1 }
        id: { type: string }
        name: { type: string }
        image: { type: string }
        state: { type: string }
        status: { type: string }
        health: { type: string, nullable: true }
        createdAt: { type: integer }
        ports:
          type: array
          items:
            type: object
            properties:
              hostIp: { type: string, nullable: true }
              hostPort: { type: integer, nullable: true }
              containerPort: { type: integer }
              protocol: { type: string }
        compose:
          type: object
          properties:
            project: { type: string, nullable: true }
            service: { type: string, nullable: true }
        metrics:
          type: object
          properties:
            cpuPercent: { type: number, nullable: true }
            memoryUsedBytes: { type: integer, nullable: true }
            memoryPercent: { type: number, nullable: true }
            restartCount: { type: integer, nullable: true }
            restartsInWindow: { type: integer, nullable: true }
            restartWindowMinutes: { type: integer }

    Task:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        target: { type: string }
        status:
          type: string
          enum: [running, succeeded, failed]
          description: |
            `cancelled` diye bir değer YOKTUR. Görev kaydı bulunamazsa yanıt
            `404`'tür, sahte bir durum değil.
        progress: { type: string }
        detail: { type: string }
        error: { type: string, nullable: true }
        startedAt: { type: integer }
        finishedAt: { type: integer, nullable: true }

    Monitor:
      type: object
      description: |
        60 günlük uptime şeridi (`days`) dışarı verilmiyor: monitör başına 60
        nesne, liste ucunu on katına çıkarırdı ve bir script'in ihtiyacı olan
        şey monitörün ŞU ANKİ durumu. Geçmiş isteyen `/api/v1/events`e bakar.
      properties:
        hostId: { type: integer, example: 1 }
        id: { type: integer }
        name: { type: string }
        type:
          type: string
          enum: [http, tcp, ping, dns, container]
        target: { type: string }
        enabled: { type: boolean }
        status:
          type: string
          enum: [up, down, bilinmiyor]
        inMaintenance: { type: boolean }
        lastCheckAt: { type: integer, nullable: true }
        lastChangeAt: { type: integer, nullable: true }
        lastLatencyMs: { type: integer, nullable: true }
        lastError: { type: string, nullable: true }
        nextCheckAt: { type: integer, nullable: true }
        consecutiveFailures: { type: integer }
        uptime24hPercent: { type: number, nullable: true }
        uptime30dPercent: { type: number, nullable: true }
        intervalSeconds:
          type: integer
          description: |
            ÇÖZÜMLENMİŞ değer — istemci "null = ayardaki varsayılan" kuralını
            bilmek zorunda kalmasın diye.
        timeoutSeconds: { type: integer }

    MonitorInput:
      type: object
      required: [name, type, target]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [http, tcp, ping, dns, container]
        target:
          type: string
          description: |
            `http` için tam adres, `tcp` için `sunucu:port`, `ping`/`dns`
            için ad ya da IP, `container` için container adı.
        expected:
          type: string
          description: Tipe göre anlamı değişir; boş bırakılabilir
        enabled: { type: boolean, default: true }
        ignoreTls: { type: boolean, default: false }
        intervalSeconds:
          type: integer
          nullable: true
          minimum: 10
          maximum: 3600
          description: "`null` = ayardaki global değeri kullan"
        timeoutSeconds:
          type: integer
          nullable: true
          minimum: 1
          maximum: 120
        retries:
          type: integer
          nullable: true
          minimum: 0
          maximum: 10
        downThreshold:
          type: integer
          nullable: true
          minimum: 1
          maximum: 20

    MonitorPatch:
      type: object
      description: |
        Gönderilmeyen alan **korunur**. Bir alanı boşaltmak için `null`
        gönder.
      properties:
        name: { type: string }
        type:
          type: string
          enum: [http, tcp, ping, dns, container]
        target: { type: string }
        expected: { type: string }
        enabled: { type: boolean }
        ignoreTls: { type: boolean }
        intervalSeconds: { type: integer, nullable: true }
        timeoutSeconds: { type: integer, nullable: true }
        retries: { type: integer, nullable: true }
        downThreshold: { type: integer, nullable: true }

    Maintenance:
      type: object
      properties:
        hostId: { type: integer, example: 1 }
        id: { type: integer }
        name: { type: string }
        kind:
          type: string
          enum: [once, weekly]
        startsAt: { type: integer, nullable: true }
        endsAt: { type: integer, nullable: true }
        weekdays:
          type: array
          description: "0 = Pazar. `kind: weekly` dışında her zaman boş."
          items: { type: integer, minimum: 0, maximum: 6 }
        startMinute: { type: integer, nullable: true, minimum: 0, maximum: 1439 }
        endMinute: { type: integer, nullable: true, minimum: 0, maximum: 1439 }
        monitorId:
          type: integer
          nullable: true
          description: "`null` = tüm monitörler"
        enabled: { type: boolean }
        active:
          type: boolean
          description: |
            Pencere ŞU AN yürürlükte mi — SUNUCUDA hesaplanır. İstemcinin
            `weekdays` + `startMinute` üçlüsünden yeniden hesaplaması, panelin
            hangi saat diliminde çalıştığını bilmesini gerektirirdi ve yanlış
            bir "aktif" değeri, bir otomasyonun bakım sırasında alarm üretmesi
            demek.

    MaintenanceInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [once, weekly]
          default: once
        startsAt:
          type: integer
          nullable: true
          description: "`kind: once` için zorunlu (unix ts)"
        endsAt: { type: integer, nullable: true }
        weekdays:
          type: array
          description: "`kind: weekly` için en az bir gün zorunlu. 0 = Pazar."
          items: { type: integer, minimum: 0, maximum: 6 }
        startMinute: { type: integer, nullable: true }
        endMinute: { type: integer, nullable: true }
        monitorId: { type: integer, nullable: true }
        enabled: { type: boolean, default: true }

    MaintenancePatch:
      type: object
      description: Gönderilmeyen alan korunur — `kind` dâhil.
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [once, weekly]
        startsAt: { type: integer, nullable: true }
        endsAt: { type: integer, nullable: true }
        weekdays:
          type: array
          items: { type: integer }
        startMinute: { type: integer, nullable: true }
        endMinute: { type: integer, nullable: true }
        monitorId: { type: integer, nullable: true }
        enabled: { type: boolean }

    App:
      type: object
      description: |
        `internalUrl`, `icon`, `color`, `widgetConfigured` dışarıda.
        `internalUrl` panelin kendi ağından çözülen adres — dış bir istemci
        için ulaşılamaz olabilir ve "çalışmayan adres" olarak görünürdü.
        Diğerleri saf sunum bilgisi.
      properties:
        hostId: { type: integer, example: 1 }
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        url:
          type: string
          description: |
            HAM adres — `{host}` yer tutucusu çözülmez. Dış bir istemcinin
            isteğinden çözülen adres o istemci için anlamsız olabilirdi.
        categoryId: { type: integer, nullable: true }
        containerName: { type: string }
        monitorId: { type: integer, nullable: true }
        source:
          type: string
          enum: [manual, docker]
        enabled: { type: boolean }
        sortOrder: { type: integer }

    AppInput:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }
        description: { type: string }
        categoryId: { type: integer, nullable: true }
        monitorId: { type: integer, nullable: true }
        containerName: { type: string }
        openNewTab: { type: boolean, default: true }
        enabled: { type: boolean, default: true }
        showOnLogin:
          type: boolean
          default: false
          description: |
            Kart karşılama sayfasında oturumsuz da listelensin mi. Diğer iki
            bayrağın TERSİ yönde varsayılan: eksik ya da bozuk bir gövde kartı
            dışarı açmamalı.

    AppPatch:
      type: object
      description: |
        Gönderilmeyen alan korunur — v1 şeklinde görünmeyen `icon`, `color`
        ve `internalUrl` dâhil.
      properties:
        name: { type: string }
        url: { type: string }
        description: { type: string }
        categoryId: { type: integer, nullable: true }
        monitorId: { type: integer, nullable: true }
        containerName: { type: string }
        openNewTab: { type: boolean }
        enabled: { type: boolean }
        showOnLogin: { type: boolean }

    Bookmark:
      type: object
      properties:
        hostId: { type: integer, example: 1 }
        id: { type: integer }
        group: { type: string }
        title: { type: string }
        url: { type: string }
        sortOrder: { type: integer }

    BookmarkInput:
      type: object
      required: [group, title, url]
      properties:
        group: { type: string }
        title: { type: string }
        url: { type: string }

    BookmarkPatch:
      type: object
      description: Gönderilmeyen alan korunur.
      properties:
        group: { type: string }
        title: { type: string }
        url: { type: string }

    Event:
      type: object
      properties:
        hostId: { type: integer, example: 1 }
        id: { type: integer }
        ts: { type: integer }
        severity: { type: string }
        source: { type: string }
        alertKey: { type: string }
        title: { type: string }
        detail: { type: string }
        notifiedChannels:
          type: array
          items: { type: string }
        suppressedReason: { type: string, nullable: true }
        acknowledgedAt: { type: integer, nullable: true }
        acknowledgedBy: { type: string, nullable: true }

    HelperResult:
      type: object
      description: host-helper'ın döndürdüğü sonuç
      properties:
        ok: { type: boolean }
        output: { type: string }
        detail: { type: string }
