# T12 — /api/v1 makine okunur sözleşmesi.
#
# ⚠️ BU DOSYA ELLE YAZILIR, koddan üretilmez.
#
# Yansıma tabanlı bir üreteç iç tipleri şemaya sızdırırdı ve `serialize.ts`
# içindeki "tipler elle yazılır" kuralıyla aynı sebepten yanlış olurdu: türetilen
# bir şema, iç model değiştiğinde sözleşmeyi sessizce değiştirir. Bu dosya
# `src/lib/apiv1/serialize.ts`in ikizidir — ikisi AYNI PR'da değişir.
#
# Doğrulama: npx @redocly/cli lint docs/openapi.yaml (CI'da koşuyor)

openapi: 3.0.3

info:
  title: Sunucu Yönetim Paneli — Dış API
  version: "1.0.0"
  description: |
    Panelin dışa açık, sürümlenmiş HTTP arayüzü. Bearer token ile kimlik
    doğrular; token bir kullanıcıya bağlıdır ve o kullanıcının izinlerinin
    **alt kümesini** taşır. Kesişim her istekte alınır: kullanıcının rolü
    daraltılırsa token da anında daralır.

    API varsayılan olarak **kapalıdır** (`api.enabled`). Kapalıyken her uç
    `404` döner — kapalı bir API'nin var olduğunu bile söylememek gerekir.

    Ayrıntılı anlatım, kararların gerekçeleri ve kopyalanabilir Prometheus /
    Home Assistant / curl örnekleri: `docs/API.md`.

    **Kararlılık:** v2 çıkana kadar bu sürümde kırıcı değişiklik yapılmaz.
    Eklemeler (yeni uç, yeni alan, yeni opsiyonel parametre, enum'a yeni değer)
    her an gelebilir; istemci bilinmeyen alanları yok saymalı ve bilinmeyen
    enum değerlerinde çökmemelidir.
  license:
    name: Özel kullanım
    url: https://example.invalid/lisans

servers:
  - url: https://sunucu:8443
    description: Caddy üzerinden panel (adres kendi kurulumuna göre değişir)

tags:
  - name: Keşif
    description: Sürüm ve uç listesi
  - name: Sistem
    description: Donanım, işletim sistemi ve zaman serisi metrikleri
  - name: Docker
    description: Container listesi, logları ve eylemleri
  - name: Görevler
    description: Uzun süren eylemlerin durumu
  - name: Monitörler
    description: Servis izleme kayıtları ve bakım pencereleri
  - name: Katalog
    description: Uygulama kartları ve bookmark'lar
  - name: Olaylar
    description: Alarm ve olay geçmişi
  - name: Host
    description: host-helper üzerinden çalışan sunucu eylemleri

security:
  - bearerAuth: []

paths:
  /api/v1:
    get:
      tags: [Keşif]
      operationId: getIndex
      summary: Kendini tanıtan uç listesi
      description: |
        İzin aranmaz ama **kimlik aranır**. Kimliksiz bırakılsaydı bir ev
        sunucusunun API yüzeyini listeleyen bedava bir keşif ucu olurdu;
        canlılık kontrolü için `/api/health` zaten var.
      responses:
        "200":
          description: Sürüm, uç listesi ve çağıranın kimliği
          headers:
            X-Panel-Api-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                    example: 1
                  endpoints:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        methods:
                          type: array
                          items: { type: string }
                        permission:
                          type: string
                          nullable: true
                        note: { type: string }
                  actor:
                    type: object
                    properties:
                      username: { type: string }
                      via:
                        type: string
                        enum: [session, token]
                      permissions:
                        type: array
                        items: { type: string }
                  docs: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/system:
    get:
      tags: [Sistem]
      operationId: getSystem
      summary: Sistem bilgisi ve son metrik anlık görüntüsü
      responses:
        "200":
          description: Sistem durumu
          headers:
            X-Panel-Api-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/hardware:
    get:
      tags: [Sistem]
      operationId: getHardware
      summary: Sıcaklıklar, disk sağlığı (SMART) ve havuz durumu
      description: |
        `notes` alanı verinin neden eksik olduğunu söyler. Boş bir rapor
        "arıza mı, yok mu" sorusunu cevapsız bırakırdı.
      responses:
        "200":
          description: Donanım raporu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hardware" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/metrics/series:
    get:
      tags: [Sistem]
      operationId: getMetricSeries
      summary: Zaman serisi
      description: |
        Katman (ham / 1dk / 1sa / 1gün) sunucuda seçilir ve yanıt hangisinin
        kullanıldığını söyler — istemci "bu nokta 5 saniyelik mi 1 saatlik
        ortalama mı" sorusunu tahmin etmek zorunda kalmasın.

        Bilinmeyen metrik **sessizce elenmez**, `400` ile reddedilir: sessiz
        eleme, yazım hatası yapan bir istemciye boş grafik gösterip sebebini
        gizlerdi. (Bu, limit kırpmasından farklı — orada istek anlamlı ama
        fazla, burada istek anlamsız.)
      parameters:
        - name: metrics
          in: query
          required: true
          description: Virgülle ayrılmış metrik listesi
          schema:
            type: string
            example: cpu.pct,mem.used_pct
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: ["1h", "6h", "24h", "7d", "30d", "1y"]
            default: "24h"
      responses:
        "200":
          description: Seri noktaları
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricSeries" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/containers:
    get:
      tags: [Docker]
      operationId: listContainers
      summary: Container listesi
      responses:
        "200":
          description: Container'lar
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostId: { type: integer, example: 1 }
                  containers:
                    type: array
                    items: { $ref: "#/components/schemas/Container" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/containers/{id}:
    parameters:
      - $ref: "#/components/parameters/ContainerId"
    get:
      tags: [Docker]
      operationId: getContainer
      summary: Tek container
      responses:
        "200":
          description: Container
          content:
            application/json:
              schema:
                type: object
                properties:
                  container: { $ref: "#/components/schemas/Container" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/containers/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/ContainerId"
    get:
      tags: [Docker]
      operationId: getContainerLogs
      summary: Container logları (düz metin, akışsız)
      description: |
        İç uç SSE ile canlı akıyor çünkü tarayıcı bunu gösterebiliyor. Bir
        script gösteremez: `curl` bir SSE akışına bağlanıp bekler ve
        `| grep` yazan kullanıcı komut istemine hiç dönmez. Burada tek parça
        gövde döner ve bağlantı kapanır.

        Sayfalanmaz — bu bir kuyruk, bir koleksiyon değil.
      parameters:
        - name: tail
          in: query
          description: Son N satır. Tavan 2000; aşan değer sessizce kırpılır.
          schema: { type: integer, default: 200, maximum: 2000 }
        - name: since
          in: query
          description: Unix zaman damgası; bu andan sonrası
          schema: { type: integer }
      responses:
        "200":
          description: Log satırları
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/containers/{id}/actions:
    parameters:
      - $ref: "#/components/parameters/ContainerId"
    post:
      tags: [Docker]
      operationId: runContainerAction
      summary: Container eylemi
      description: |
        `Idempotency-Key` kapsam dışı ve bu bilinçli: bu eylemler zaten
        tekrarlanabilir — iki kez `restart`, bir kez `restart`tan farklı bir
        duruma götürmez.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [start, stop, restart, pause, unpause]
      responses:
        "200":
          description: Eylem uygulandı; container'ın yeni hâli
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  container: { $ref: "#/components/schemas/Container" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /api/v1/containers/{id}/update:
    parameters:
      - $ref: "#/components/parameters/ContainerId"
    post:
      tags: [Docker, Görevler]
      operationId: updateContainer
      summary: İmajı güncelle (asenkron)
      description: |
        Senkron değil, "kabul edildi, poll et". Birkaç GB'lık bir imajın
        çekilmesi dakikalar sürer; senkron tutulsaydı hattaki her ara katmanın
        zaman aşımı devreye girerdi ve istemci işlemin başarısız olduğunu
        sanarken işlem arkada devam ederdi. Yanlış bilgi veren bir yanıt, geç
        gelen yanıttan kötüdür.

        Üst sınır 900 saniye; aşımda görev `failed` + `upstream_error`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Görev başlatıldı
          headers:
            Retry-After:
              description: Önerilen poll aralığı (saniye)
              schema: { type: integer, example: 5 }
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId: { type: string, example: tsk_9f2c1d4e7a03b5c8d1e2f3a4 }
                  status: { type: string, example: running }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/HelperUnavailable" }

  /api/v1/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Görevler]
      operationId: getTask
      summary: Uzun süren eylemin durumu
      description: |
        Yalnızca görevi **başlatan** token/kullanıcı okuyabilir. `taskId`
        tahmin edilemez olsa da yetki kontrolü tahmin edilemezliğe bırakılmaz.

        ⚠️ `404` **"işlem iptal edildi" DEMEK DEĞİLDİR.** Görev kaydı bellek
        içidir (en fazla 100 kayıt, TTL 1 saat) ve panel yeniden başlarsa
        kaybolur. Ama `dockerd` panelin bir parçası değil, host'ta çalışıyor:
        imaj çekme kesilmez ve büyük ihtimalle tamamlanır. Container'ın güncel
        durumunu `GET /api/v1/containers/{id}` ile doğrula. Aynı sebeple
        `status` alanında `cancelled` gibi sahte bir değer üretilmez.
      responses:
        "200":
          description: Görev durumu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: |
            Görev kaydı bulunamadı. **İptal edildiği anlamına gelmez** —
            yukarıdaki açıklamaya bakın.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/monitors:
    get:
      tags: [Monitörler]
      operationId: listMonitors
      summary: Monitör listesi ve anlık durumları
      parameters:
        - $ref: "#/components/parameters/CollectionLimit"
      responses:
        "200":
          description: Monitörler
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostId: { type: integer, example: 1 }
                  monitors:
                    type: array
                    items: { $ref: "#/components/schemas/Monitor" }
                  hasMore: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Monitörler]
      operationId: createMonitor
      summary: Monitör oluştur
      description: "İzin: `monitors.manage`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorInput" }
      responses:
        "201":
          description: Oluşturuldu
          headers:
            Location:
              description: Oluşan kaynağın adresi
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  monitor: { $ref: "#/components/schemas/Monitor" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/monitors/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Monitörler]
      operationId: getMonitor
      summary: Tek monitör
      responses:
        "200":
          description: Monitör
          content:
            application/json:
              schema:
                type: object
                properties:
                  monitor: { $ref: "#/components/schemas/Monitor" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      tags: [Monitörler]
      operationId: patchMonitor
      summary: Kısmi güncelleme
      description: |
        **Gerçek birleştirme:** gönderilmeyen alan korunur. Bir alanı
        boşaltmak için `null` gönder — JSON'da `undefined` yok, dolayısıyla
        anahtarın gövdede bulunması onu kastettiğin anlamına gelir.

        (Panelin kendi `/api/monitors/{id}` ucu böyle davranmaz; orada gövde
        tam kayıt olarak yorumlanır. v1'de düzeltildi.)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorPatch" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                type: object
                properties:
                  monitor: { $ref: "#/components/schemas/Monitor" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Monitörler]
      operationId: deleteMonitor
      summary: Monitörü sil
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/monitors/{id}/check:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [Monitörler]
      operationId: checkMonitor
      summary: Monitörü hemen kontrol et
      description: |
        Gövde gerektirmez. `Idempotency-Key` kapsam dışı: bir kontrolü iki kez
        çalıştırmak yalnızca iki ölçüm demek, kalıcı bir yan etki değil.
      responses:
        "200":
          description: Kontrol sonucu
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  latencyMs: { type: integer, nullable: true }
                  error: { type: string, nullable: true }
                  attempts: { type: integer }
                  monitor:
                    # OpenAPI 3.0 bir $ref'i doğrudan nullable yapamıyor;
                    # type + allOf sarmalayıcısı bunun standart karşılığı.
                    type: object
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/Monitor" }]
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/maintenance:
    get:
      tags: [Monitörler]
      operationId: listMaintenance
      summary: Bakım pencereleri
      parameters:
        - $ref: "#/components/parameters/CollectionLimit"
      responses:
        "200":
          description: Pencereler
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostId: { type: integer, example: 1 }
                  maintenance:
                    type: array
                    items: { $ref: "#/components/schemas/Maintenance" }
                  hasMore: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Monitörler]
      operationId: createMaintenance
      summary: Bakım penceresi oluştur
      description: "İzin: `monitors.manage`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceInput" }
      responses:
        "201":
          description: Oluşturuldu
          headers:
            Location:
              description: Oluşan kaynağın adresi
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  maintenance: { $ref: "#/components/schemas/Maintenance" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/maintenance/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Monitörler]
      operationId: getMaintenance
      summary: Tek bakım penceresi
      responses:
        "200":
          description: Pencere
          content:
            application/json:
              schema:
                type: object
                properties:
                  maintenance: { $ref: "#/components/schemas/Maintenance" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      tags: [Monitörler]
      operationId: patchMaintenance
      summary: Kısmi güncelleme
      description: |
        Birleştirme burada özellikle önemli: `kind` gövdede yoksa `once`
        varsayılır. Birleştirme olmasaydı haftalık bir pencereyi
        `{"enabled": false}` ile kapatmak, onu sessizce tek seferliğe çevirip
        `weekdays` listesini silerdi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenancePatch" }
      responses:
        "200":
          description: Güncellendi
          content:
            application/json:
              schema:
                type: object
                properties:
                  maintenance: { $ref: "#/components/schemas/Maintenance" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
