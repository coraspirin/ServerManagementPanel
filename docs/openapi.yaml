      description: |
        `offset` değil `cursor`: `events` sürekli yeni satır alan bir tablo ve
        offset ile sayfa gezerken araya yeni kayıt girdiğinde sayfa kayar.
        İmleç bu sınıf hatayı yapısal olarak imkânsız kılıyor.

        İmleç **opaktır** — çözümleme, üretme, biçimine güvenme. Bozuk imleç
