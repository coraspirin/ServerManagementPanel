services:
  panel:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.13.1}
    image: server-panel:local
    restart: unless-stopped
    # docker.sock kök:docker sahipliğinde ve 0660 modunda; panel root olmayan
    # bir kullanıcı (uid 1001) ile çalıştığı için soketi ancak host'un docker
    # grubuna eklenerek okuyabiliyor. GID host'a göre değişir:
    #   getent group docker | cut -d: -f3
    # ⚠️ Bu, docker.sock erişiminin zaten getirdiği yetkiyi genişletmiyor —
    #    aynı yetkiyi KULLANILABİLİR kılıyor. Soket erişimi pratikte host'ta
    #    root demektir; alternatifi M1.6'da değerlendirilecek socket-proxy'dir.
    group_add:
      - "${DOCKER_GID:?DOCKER_GID tanimli degil - bkz .env.example}"
    environment:
      # T10 — sorun ayıklarken 1 yapılıp panel sahte veriyle ayağa kaldırılabilir.
      MOCK_MODE: ${MOCK_MODE:-0}
      APP_VERSION: ${APP_VERSION:-1.13.1}
      TZ: ${TZ:-Europe/Istanbul}
      # T3 — secret şifreleme anahtarı. Yoksa panel açılmaz.
      # Panel dışında AYRI bir yerde de saklanmalı; yedeğe girmez.
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY tanimli degil - bkz .env.example}
      # T4 — host-helper ile paylaşılan HMAC sırrı. Boşsa host işlemleri
      # (güç, systemd, compose) kapalıdır ve panel bunu açıkça söyler.
      HELPER_SECRET: ${HELPER_SECRET:-}
      # Panelin host'ta yayınlandığı port — aşağıdaki `ports:` ile AYNI değer.
      # Panel bunu yığın kurulumunda "bu port panelin kendisi" uyarısı için
      # biliyor; yalnızca `ports:` satırında dursaydı öğrenmesinin yolu yoktu.
      PANEL_HTTP_PORT: ${PANEL_HTTP_PORT:-8080}
      # Önüne TLS sonlandıran kendi vekilini koyduysan 1 yap: o vekilden gelen
      # X-Forwarded-For / X-Forwarded-Proto korunur. Panel portu o vekilden
      # başka hiçbir yere açık DEĞİLSE kullan (bkz. scripts/docker-entry.mjs).
      PANEL_TRUST_PROXY: ${PANEL_TRUST_PROXY:-0}
    volumes:
      # Kalıcı panel verisi: sqlite.db, migration öncesi kopyalar, logolar (M0.3)
      - panel-data:/app/data

      # Docker yönetimi (M1.6+).
      # ⚠️ GÜVENLİK: docker.sock erişimi pratikte host'ta root yetkisine eşittir.
      #    `:ro` bunu ENGELLEMEZ — salt-okunur bayrağı dosya düğümüne uygulanır,
      #    soket üzerinden giden API çağrılarına değil. Bu yüzden buraya bilerek
      #    `:ro` yazılmadı; yanlış bir güvenlik hissi vermesin.
      #    M1.6'da docker-socket-proxy ile API uçlarını kısıtlamayı değerlendir.
      - /var/run/docker.sock:/var/run/docker.sock

      # T4 — host-helper soketi (M1.13).
      #
      # ⚠️ Bu soket docker.sock'tan FARKLIDIR: root vermez. Ne çalıştırılacağına
      #    host'taki /etc/panel-helper/allow.conf karar verir ve o dosya
      #    container'a mount EDİLMEZ — panel ele geçirilse bile listeyi
      #    genişletemez.
      #
      # Host'ta `sudo host-helper/install.sh` çalıştırılmamışsa dizin boştur:
      # panel ayağa kalkar ama host işlemleri "soket yok" diyerek reddedilir.
      # Helper kullanılmayan bir kurulumda bu satır yorumlanabilir.
      #
      # ⚠️ DOSYA DEĞİL DİZİN bağlanıyor — sebebi yaşanmış bir arıza:
      #    Docker tek bir dosyayı mount ederken yola değil INODE'a bağlanır.
      #    Helper her yeniden başlayışında soketi silip yeniden yaratıyor;
      #    dosyayı mount eden container o andan sonra silinmiş inode'a bakar
      #    ve her istek ECONNREFUSED alır. Sunucuda helper 26 Ağustos'ta
      #    yeniden başladı ve 21 Ağustos'tan beri ayakta olan panel bir daha
      #    hiçbir host komutu çalıştıramadı. Dizin mount'ları içeriği canlı
      #    çözdüğü için soketin yeniden yaratılması artık şeffaf.
      #
      #    Bunun ikinci faydası: Docker, bind-mount kaynağı yokken onu DİZİN
      #    olarak yaratıyor ve eskiden bu felaketti (helper soketi açamaz,
      #    container "dizini dosyanın üstüne mount edemem" der). Artık zaten
      #    dizin beklediğimiz için Docker'ın yaratması zararsız.
      - /run/panel-helper:/run/panel-helper

      # Host sistem metrikleri (M1.1) — container'ın kendi /proc'u değil,
      # host'unki okunmalı. Özellikle /proc/net/dev ağ namespace'ine tabidir:
      # mount olmadan container'ın eth0'ı ölçülürdü, sunucunun ağ kartı değil.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

      # Disk doluluğu hiçbir /proc dosyasında yok; `statfs` gerçek bir yol ister.
      # ⚠️ GÜVENLİK: bu, host'un TÜM dosya sistemini container'a salt-okunur
      #    açar (/etc/shadow dahil). Bilinçli bir taviz: panelin işi zaten
      #    sunucuyu yönetmek ve aynı container docker.sock'a da erişiyor —
      #    yani bu mount mevcut yetki sınırını GENİŞLETMİYOR. Yine de panelin
      #    docker.sock'suz çalıştırıldığı bir kurulumda bu satır kaldırılıp
      #    yalnızca izlenmek istenen bölümler tek tek mount edilebilir:
      #      - /mnt/veri:/host/root/mnt/veri:ro
      #    rslave: host'ta sonradan bağlanan diskler container'da da görünsün.
      - /:/host/root:ro,rslave

      # S.M.A.R.T ve ZFS raporu (M1.4). Host'ta cron ile çalışan
      # scripts/hardware.sh buraya JSON bırakır; panel YALNIZCA OKUR.
      # smartctl ham disk erişimi (CAP_SYS_RAWIO) ister — container'a vermek
      # yerine veriyi host'ta üretip salt-okunur aktarmak tercih edildi (T4).
      - ${PANEL_REPORTS_DIR:-./reports}:/app/reports:ro
      - /etc/os-release:/host/etc/os-release:ro
      # Container'ın kendi UTS namespace'i kendi kimliğini döndürür; panelin
      # göstermesi gereken SUNUCU adı buradan okunur.
      - /etc/hostname:/host/etc/hostname:ro
    ports:
      # Panelin tek girişi (düz HTTP). Container içinde 3000'de ön katman
      # dinliyor; Next yalnızca loopback'te (bkz. scripts/docker-entry.mjs).
      # ⚠️ Trafik (parola, oturum çerezi, web terminal) yerel ağda ŞİFRESİZ
      #    taşınır. Paneli internete açacaksan önüne TLS sonlandıran bir vekil
      #    koy ve PANEL_TRUST_PROXY=1 yap.
      - "${PANEL_HTTP_PORT:-8080}:3000"

volumes:
  panel-data:

networks:
  default:
    # Alt ağ SABİTLENİYOR (M1.2). Sebep: container'dan host'un kendi portlarına
    # (ör. host ağında çalışan Home Assistant) erişim ufw tarafından düşürülür ve
    # bunu açan güvenlik duvarı kuralı alt ağa göre yazılır. Docker alt ağı
    # kendiliğinden atarsa ağ her yeniden oluşturulduğunda değişebilir ve kural
    # sessizce işlevsiz kalır. Çakışma olursa .env'den değiştirilebilir.
    ipam:
      config:
        - subnet: ${PANEL_SUBNET:-172.28.0.0/16}
